# Pueo only, and the one name here is magikh0e.
#
# Buy Me a Coffee alone, on purpose. GitHub renders the Sponsor dropdown by
# platform name and nothing else, so every extra entry is another thing a
# visitor has to choose between with no information to choose on. One entry
# cannot be picked wrongly.
#
# CiferTech's Patreon used to sit here, so that sponsorship could reach the
# project this is built on. The intent was right and the placement was not:
# a visitor saw two platform names with nothing saying which went where, and
# anyone meaning to support Pueo had even odds of funding somebody else.
# That link moved to the Lineage section of README.md, next to the sentence
# explaining who CiferTech is and why nearly every feature here is theirs.
# Credit reads as credit there. In a dropdown it read as a coin toss.
#
# GitHub Sponsors belongs here as well and is not here yet. It takes no
# platform cut, which at this scale is most of the difference, and it sits
# on the repository rather than asking somebody to leave it. The line is
# below, commented, because the listing does not exist: the GraphQL field
# hasSponsorsListing is false for this account, so /sponsors/magikh0e
# redirects to the profile. Uncommented now it would put "GitHub" in the
# dropdown pointing at a page that cannot take a payment.
#
# Enable it at github.com/sponsors, finish the bank and tax details, then
# uncomment. Nothing else needs to change.
buy_me_a_coffee: magikh0e
# github: magikh0e
