<svg viewBox="0 0 900 640" role="img" aria-labelledby="sold-t sold-d" font-family="JetBrains Mono, Consolas, monospace">
<title id="sold-t">Where the six soldered joints land on the ESP32 module</title>
<desc id="sold-d">The ESP32-WROOM-32 module with its antenna at the top, which is how the build guide counts pads. The module has thirty-eight castellated pads, drawn as fourteen down each long edge and ten across the bottom, which is how they count on the board. The fourteen down the edge are numbered, because every soldered joint is among them. The bottom row is labelled by signal name instead: IO2 at the right-hand corner, then IO15, SD1, SD0 and CLK running leftwards, the last three being the module's own flash and marked as pads that ruin the board. The left-hand corner is on the other long edge, of which only pad 10 is recorded here. Counting starts at the top of the right-hand edge and runs down it to fifteen, then turns the bottom-right corner and continues leftwards along the bottom edge for sixteen to nineteen. Five of the six soldered signals are on the right-hand edge: pad 2 is IO23 carrying VSPI MOSI, pad 8 is IO19 carrying VSPI MISO, pad 9 is IO18 carrying VSPI SCK, pad 11 is IO17 carrying the PN532 slave select, and pad 12 is IO16 carrying the NRF24 chip enable. Those five are drawn in orange, meaning solder here. The sixth is pad 10 counted down the left-hand edge, IO25, carrying the NRF24 chip select. Five pads are marked as hazards with a double exclamation mark. On the right edge, pad 10 is IO5, the microSD card's chip select, sitting directly between IO18 and IO17 which are two of the targets, and pad 14 is IO0, the boot strapping pin. On the bottom edge, pads 17, 18 and 19 are SD1, SD0 and CLK, the module's internal flash, and bridging any of them stops the board booting. The left edge is drawn numbered but unnamed apart from pad 10, because that is all the build guide records for that side.</desc>
<rect x="0" y="0" width="900" height="640" fill="var(--bg-card, #0a1116)"/>
<text x="20" y="24" fill="var(--text-dim, #9fb3bf)" font-size="13">Where the six soldered joints are</text>
<text x="20" y="44" fill="var(--text-dim, #9fb3bf)" font-size="10.5">Turn the board until the antenna points up. 14 down each edge, 10 across the bottom, which is what you count.</text>
